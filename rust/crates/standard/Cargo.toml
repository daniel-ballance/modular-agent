[package]
name = "standard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The standard configuration of the Modular Agent: a coding agent with Pi's feature set."

[[bin]]
name = "ma"
path = "src/main.rs"

[dependencies]
opentelemetry.workspace = true
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client", "reqwest-rustls", "grpc-tonic", "tls-ring", "tls-roots"] }
modular-agent = { path = "../sdk" }
modular-agent-files = { path = "../tools-files" }
modular-agent-mcp = { path = "../sdk-mcp" }
credentials-auth = { path = "../credentials-auth" }
tools-code = { path = "../tools-code" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
jiff = "=0.2.46"
monty-alloc = { version = "=1.6.0", features = ["exit-code"] }
monty-proto = { version = "=1.6.0", features = ["worker"] }
monty-types = "=1.6.0"

tempfile.workspace = true

[dev-dependencies]
libc.workspace = true
