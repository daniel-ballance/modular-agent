[package]
name = "sdk-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runs conformance/sdk/scenarios against the Rust SDK"

[dependencies]
sha2 = "=0.10.9"
agent-api = { path = "../agent-api" }
history-fs = { path = "../history-fs" }
opentelemetry.workspace = true
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
serde.workspace = true
uuid.workspace = true
modular-agent = { path = "../sdk" }
futures-util.workspace = true
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
standard = { path = "../standard" }
transport-websocket = { path = "../transport-websocket", features = ["http"] }
axum = "0.8"
anyhow.workspace = true
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
log = { version = "0.4", features = ["std"] }
