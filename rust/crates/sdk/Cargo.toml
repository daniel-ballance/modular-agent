[package]
name = "modular-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build agents from interchangeable parts. The Rust SDK, following docs/sdk."

[features]
agui = ["dep:axum", "dep:chrono", "dep:form_urlencoded", "dep:log", "transport-websocket/http"]

[[test]]
name = "agui"
required-features = ["agui"]

[dependencies]
form_urlencoded = { version = "1.2", optional = true }
axum = { version = "0.8", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
transport-websocket = { path = "../transport-websocket" }
agent-api.workspace = true
agent-harness.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
schemars = "1.2"
async-stream = "0.3"
log = { version = "0.4", optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
fs2.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

environment-local = { path = "../environment-local" }
config-files = { path = "../config-files" }
credentials-file = { path = "../credentials-file" }
provider-fake = { path = "../provider-fake" }
tools-builtin = { path = "../tools-builtin" }
feature-approval = { path = "../feature-approval" }
feature-commands = { path = "../feature-commands" }
feature-context = { path = "../feature-context" }
feature-jobs = { path = "../feature-jobs" }
feature-model = { path = "../feature-model" }
feature-prompt = { path = "../feature-prompt" }
feature-questions = { path = "../feature-questions" }
history-fs = { path = "../history-fs" }
plugin-stdio = { path = "../plugin-stdio" }
provider-openai = { path = "../provider-openai" }
interface-acp = { path = "../interface-acp" }
history-http = { path = "../history-http" }
reqwest.workspace = true
base64 = "=0.23.1"
base64-oauth = { package = "base64", version = "=0.22.1" }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
runtime-durable = { path = "../runtime-durable" }
runtime-transient = { path = "../runtime-transient" }

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
schemars = "1.2"
serde.workspace = true
