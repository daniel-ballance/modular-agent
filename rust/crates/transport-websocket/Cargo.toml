[package]
name = "transport-websocket"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
http = ["dep:axum-core", "dep:hyper", "dep:hyper-util", "tokio-util/rt"]

[dependencies]
axum-core = { version = "0.5", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
anyhow.workspace = true
futures-util = { workspace = true, features = ["sink"] }
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Tungstenite 0.30 traces the serialized upgrade, including Authorization.
# Compile out log TRACE calls so an embedding application's logger cannot expose the token.
log = { version = "0.4", features = ["max_level_debug"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
subtle = "2"
url = "2"

[dev-dependencies]
tempfile.workspace = true
rcgen = "0.14"
