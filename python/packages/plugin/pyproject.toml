[project]
name = "ma-plugin"
version = "0.2.0"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ma-core",
    "ma-local",
    "ma-tools",
    "ma-acp",
    "ma-runtime",
    "ma-durable",
    "websockets>=17.4",
]

[project.scripts]
modular-agent-plugin = "ma_plugin.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
ma-core = { workspace = true }
ma-local = { workspace = true }
ma-tools = { workspace = true }
ma-acp = { workspace = true }
ma-runtime = { workspace = true }
ma-durable = { workspace = true }
