[project]
name = "modular-agent-standard"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "modular-agent==0.1.0",
    "pydantic-monty==1.6.0",
    "httpx2==2.16.2",
    "opentelemetry-api==1.45.2",
]

[project.scripts]
ma = "ma_standard:main"

[tool.uv.sources]
modular-agent = { workspace = true }

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ma_standard"]
