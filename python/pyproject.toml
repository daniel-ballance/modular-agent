[project]
name = "modular-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ma-plugin",
    "ma-process",
    "ma-core",
    "ma-harness",
    "ma-history",
    "ma-runtime",
    "ma-durable",
    "ma-local",
    "ma-tools",
    "ma-fake",
    "ma-claude",
    "ma-config",
    "ma-credentials",
    "ma-context",
    "ma-prompt",
    "ma-selection",
    "ma-guardrail",
    "ma-commands",
    "ma-terminal",
    "ma-questions",
    "ma-approval",
    "ma-jobs",
    "ma-subagents",
    "ma-durable-subagents",
    "ma-mcp",
    "ma-acp",
    "pydantic>=2.14.3",
    "jsonschema>=4.26.0",
    "httpx2>=2.16.2",
]

[project.scripts]
modular-agent = "ma_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modular_agent", "ma_cli"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ma-plugin = { workspace = true }
ma-process = { workspace = true }
ma-core = { workspace = true }
ma-harness = { workspace = true }
ma-history = { workspace = true }
ma-runtime = { workspace = true }
ma-durable = { workspace = true }
ma-local = { workspace = true }
ma-tools = { workspace = true }
ma-fake = { workspace = true }
ma-claude = { workspace = true }
ma-config = { workspace = true }
ma-credentials = { workspace = true }
ma-context = { workspace = true }
ma-prompt = { workspace = true }
ma-selection = { workspace = true }
ma-guardrail = { workspace = true }
ma-commands = { workspace = true }
ma-terminal = { workspace = true }
ma-questions = { workspace = true }
ma-approval = { workspace = true }
ma-jobs = { workspace = true }
ma-subagents = { workspace = true }
ma-durable-subagents = { workspace = true }
ma-mcp = { workspace = true }
ma-acp = { workspace = true }

[dependency-groups]
dev = ["mypy>=1.17", "pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.5"]

[tool.mypy]
strict = true
files = ["modular_agent"]

[[tool.mypy.overrides]]
module = [
    "ma_cli", "ma_cli.*",
    "ma_acp", "ma_acp.*",
    "ma_approval", "ma_approval.*",
    "ma_claude", "ma_claude.*",
    "ma_commands", "ma_commands.*",
    "ma_config", "ma_config.*",
    "ma_context", "ma_context.*",
    "ma_core", "ma_core.*",
    "ma_credentials", "ma_credentials.*",
    "ma_durable", "ma_durable.*",
    "ma_durable_subagents", "ma_durable_subagents.*",
    "ma_fake", "ma_fake.*",
    "ma_guardrail", "ma_guardrail.*",
    "ma_harness", "ma_harness.*",
    "ma_history", "ma_history.*",
    "ma_jobs", "ma_jobs.*",
    "ma_local", "ma_local.*",
    "ma_mcp", "ma_mcp.*",
    "ma_plugin", "ma_plugin.*",
    "ma_process", "ma_process.*",
    "ma_prompt", "ma_prompt.*",
    "ma_questions", "ma_questions.*",
    "ma_runtime", "ma_runtime.*",
    "ma_selection", "ma_selection.*",
    "ma_subagents", "ma_subagents.*",
    "ma_terminal", "ma_terminal.*",
    "ma_tools", "ma_tools.*",
    "jsonschema",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
