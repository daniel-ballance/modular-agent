<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ops desk</title>
    <link rel="stylesheet" href="/desk.css" />
    <script type="module" src="/page.js"></script>
  </head>
  <body>
    <main>
      <h1>Ops desk</h1>
      <p id="agents"></p>
      <p id="message" role="status"></p>
      <section>
        <h2>Inbox</h2>
        <div id="inbox"></div>
        <details>
          <summary>Closed items</summary>
          <ul id="closed"></ul>
        </details>
      </section>
      <details>
        <summary>Run receipts</summary>
        <ul id="runs"></ul>
      </details>
      <section>
        <h2>Conversation</h2>
        <ol id="posts"></ol>
      </section>
    </main>
  </body>
</html>
